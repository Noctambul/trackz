name: Cypress Tests
on: [pull_request]
jobs:
  Component-tests:  
    name: Run Component Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Cypress run component tests
        uses: cypress-io/github-action@v4
        with:
          working-directory: web
          component: true
  E2E-tests:  
    name: Run E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Cypress run component tests
        uses: cypress-io/github-action@v4
        with:
          working-directory: web