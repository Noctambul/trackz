name: cypress
on: [pull_request]
env:
  NEXT_PUBLIC_TRACKZ_EDITION_CONTRACT: "0x176C73e98433A5cC99C78E12cce1F3C2F79b3051"
  NEXT_PUBLIC_TEST_MODE: true
  NETWORK: goerli
  MINT_WALLET_PRIVATE_KEY: ${{ secrets.MINT_WALLET_PRIVATE_KEY }}
jobs:
  Component-tests:  
    name: component-tests
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Cypress run component tests
        uses: cypress-io/github-action@v4
        with:
          working-directory: web
          component: true
  E2E-tests:  
    name: e2e-tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Cypress run e2e tests
        uses: cypress-io/github-action@v4
        with:
          working-directory: web
          build: yarn build
          start: yarn start
