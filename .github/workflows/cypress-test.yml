name: cypress
on: [pull_request]
env:
  NEXT_PUBLIC_TRACKZ_EDITION_CONTRACT: "0x3fB61AAA31c038E16d3ca27F154F5E88Bc00c67E"
  NEXT_PUBLIC_TEST_MODE: true
  NETWORK: rinkeby
  MINT_WALLET_PRIVATE_KEY: ${{ secrets.MINT_WALLET_PRIVATE_KEY }}
jobs:
  Component-tests:  
    name: component-tests
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Cypress run component tests
        uses: cypress-io/github-action@v4
        with:
          working-directory: web
          component: true
  E2E-tests:  
    name: e2e-tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Cypress run e2e tests
        uses: cypress-io/github-action@v4
        with:
          working-directory: web
          build: yarn build
          start: yarn start